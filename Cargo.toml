[workspace]
resolver = "2"
members = ["crates/engine-core", "crates/viewer"]

[workspace.package]
edition = "2021"
version = "0.1.0"

# Keep our own code quick to compile but make dependencies (bevy, wgpu) fast at runtime.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# the physics and the sound solver are number crunching: keep them fast in dev builds and tests too
[profile.dev.package.engine-core]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
